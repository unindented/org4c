name: Fuzz Test

on:
  pull_request:
    paths:
      - '**.c'
      - '**.h'

jobs:
  Fuzzing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build Fuzzer
        run: |
          clang -g -O1 -fsanitize=fuzzer,address,undefined -fno-sanitize-recover=undefined \
                -Isrc src/org4c.c src/entity.c src/org4c-html.c test/fuzzers/fuzz-orghtml.c \
                -o "$RUNNER_TEMP/fuzz-orghtml"
      - name: Run Fuzzer
        run: |
          mkdir -p "$RUNNER_TEMP/corpus" "$RUNNER_TEMP/artifacts"
          cp test/fuzzers/seed-corpus/* "$RUNNER_TEMP/corpus/"
          "$RUNNER_TEMP/fuzz-orghtml" -max_total_time=600 -max_len=4096 \
                -artifact_prefix="$RUNNER_TEMP/artifacts/" "$RUNNER_TEMP/corpus"
      - name: Upload Crash
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: artifacts
          path: ${{ runner.temp }}/artifacts
