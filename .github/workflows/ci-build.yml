name: Build and Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  # Linux builds.
  #
  # gcc sometimes warns (e.g. about potentially uninitialized variables) only
  # when some optimizations are enabled. So we build Debug as well as Release
  # on Linux. The Debug build also collects and uploads test coverage.
  linux-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configure
        run: CFLAGS='--coverage -Werror' cmake -DCMAKE_BUILD_TYPE=Debug -G 'Unix Makefiles' .
      - name: Build
        run: make VERBOSE=1
      - name: Test
        run: python3 ./scripts/run-tests.py
      - name: Test encoding-sensitive inputs
        run: |
          cc -Wall -Wextra -Werror -Isrc test/utf16/test-utf16.c src/org4c.c src/entity.c -o "$RUNNER_TEMP/test-utf16"
          "$RUNNER_TEMP/test-utf16"
      - name: Create coverage report
        run: |
          sudo apt-get install -y lcov
          lcov --directory . --capture --branch-coverage --output-file coverage.info
          lcov --list coverage.info --branch-coverage
      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  linux-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configure
        run: CFLAGS='--coverage -Werror' cmake -DCMAKE_BUILD_TYPE=Release -G 'Unix Makefiles' .
      - name: Build
        run: make VERBOSE=1
      - name: Test
        run: python3 ./scripts/run-tests.py

  # Windows builds.
  #
  # We do both 32 and 64-bit builds. Also note 32-bit does Debug build while
  # 64-bit one does Release build. (Full matrix would likely be an overkill.)
  windows-32-debug:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Dev command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86
      - name: Configure
        run: cmake -DCMAKE_BUILD_TYPE=Debug -G "NMake Makefiles" .
      - name: Build
        run: nmake
      - name: Test
        run: python .\scripts\run-tests.py
      # The UTF-16 build is only supported on Windows (and only in the parser).
      - name: Build UTF-16 test
        run: cl /nologo /W3 /DORG4C_USE_UTF16 /D_CRT_SECURE_NO_WARNINGS /Isrc test\utf16\test-utf16.c src\org4c.c src\entity.c "/Fo${env:RUNNER_TEMP}\" "/Fe${env:RUNNER_TEMP}\test-utf16.exe"
      - name: Test UTF-16 build
        run: '& "${env:RUNNER_TEMP}\test-utf16.exe"'

  windows-64-release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Dev command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure
        run: cmake -DCMAKE_BUILD_TYPE=Release -G "NMake Makefiles" .
      - name: Build
        run: nmake
      - name: Test
        run: python .\scripts\run-tests.py
      # The UTF-16 build is only supported on Windows (and only in the parser).
      - name: Build UTF-16 test
        run: cl /nologo /W3 /DORG4C_USE_UTF16 /D_CRT_SECURE_NO_WARNINGS /Isrc test\utf16\test-utf16.c src\org4c.c src\entity.c "/Fo${env:RUNNER_TEMP}\" "/Fe${env:RUNNER_TEMP}\test-utf16.exe"
      - name: Test UTF-16 build
        run: '& "${env:RUNNER_TEMP}\test-utf16.exe"'
